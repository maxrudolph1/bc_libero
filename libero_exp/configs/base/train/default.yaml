defaults:
    - optimizer@optimizer: adam_w.yaml
    - scheduler@scheduler: cosine_annealing.yaml


# training
seed: 0
device: "cuda"
train_gpus: [0]
mix_precision: false
use_augmentation: true

n_epochs: 50        
batch_size: 64
num_workers: 8

val_freq: 5
save_freq: 10
log_freq: 10                    # wandb train metrics every N batches (0 = epoch end only)
print_freq: 50                  # console train metrics every N batches
epoch_log_freq: 1               # console epoch summary every N epochs

grad_clip: 100.
loss_scale: 1.0
mi_loss_scale: 1e-4
mine_mi_loss_scale: 0.1

# When true (CardPol / VAE / CURL / VIP / ICVF), BC does not backprop into the
# spatial / input encoder: only the aux representation loss updates it. Temporal
# modules and the action head still train from BC on detached encoder features.
stop_encoder_grad_from_bc: false

# resume training
resume: false
resume_path: ""

# degug
debug: false
dry: false                      # dry run 
