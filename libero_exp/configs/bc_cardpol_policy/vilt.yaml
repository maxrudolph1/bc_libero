defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_cardpol_policy
  - ../base/policy@policy: vilt_policy
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir

experiment_dir: ???

data:
  dual_task:
    enable: true
    focused_task_id: 0
    future_step_min: 1
    future_step_max: 10

train:
  rep_loss_scale: 1.0
  rep_classifier_hidden: 256


wandb:
  use_wandb: true
  policy_arch: vilt
  project: bc-cardpol-vilt
  name: ${data.env_name}_${algo.algo_name}_vilt_task${data.dual_task.focused_task_id}_${now:%m%d}_${now:%H%M}_seed${train.seed}_ratio${data.train_ratio}
  group: ${data.env_name}_${algo.algo_name}_vilt
