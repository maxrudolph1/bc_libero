defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_curl_policy
  - ../base/policy@policy: dp
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir

experiment_dir: ???

data:
  dual_task:
    enable: true
    focused_task_id: 0
    future_step_min: 1
    future_step_max: 10

train:
  rep_loss_scale: 1.0
  curl_proj_dim: 64
  curl_hidden_dim: 256
  curl_temperature: 0.1


wandb:
  use_wandb: true
  policy_arch: dp
  project: bc-curl-dp
  name: ${data.env_name}_${algo.algo_name}_dp_task${data.dual_task.focused_task_id}_${now:%m%d}_${now:%H%M}_seed${train.seed}_ratio${data.train_ratio}
  group: ${data.env_name}_${algo.algo_name}_dp
