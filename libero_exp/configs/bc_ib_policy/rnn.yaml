defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_ib_policy    
  - ../base/policy@policy: rnn_policy    # policy_name: BCRNNPolicy, image encoder: resnet, decoder: rnn
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir

experiment_dir: ???

wandb:
  use_wandb: true
  policy_arch: rnn
  project: bc-ib-rnn
  name: ${data.env_name}_${algo.algo_name}_rnn_${now:%m%d}_${now:%H%M}_seed${train.seed}_ratio${data.train_ratio}_scale${train.mi_loss_scale}_${train.mine_mi_loss_scale}
  group: ${data.env_name}_${algo.algo_name}_rnn

