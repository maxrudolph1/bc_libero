defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_ib_policy   
  - ../base/policy@policy: vilt_policy    # policy_name: BCViLTPolicy, image encoder: ViT, decoder: transformer
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir

experiment_dir: ???


wandb:
  use_wandb: true
  policy_arch: vilt
  project: bc-ib-vilt
  name: ${data.env_name}_${algo.algo_name}_${now:%m%d}_${now:%H%M}_seed${train.seed}_ratio${data.train_ratio}_scale${train.mi_loss_scale}_${train.mine_mi_loss_scale}
  group: ${data.env_name}_${algo.algo_name}

