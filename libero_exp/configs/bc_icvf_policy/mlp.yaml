defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_icvf_policy
  - ../base/policy@policy: mlp_policy
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir

experiment_dir: ???

data:
  dual_task:
    enable: true
    focused_task_id: 0
    future_step_min: 1
    future_step_max: 10
    mixed_mode: icvf
    icvf_p_randomgoal: 0.3
    icvf_p_trajgoal: 0.5
    icvf_p_currgoal: 0.2
    icvf_p_samegoal: 0.5
    icvf_reward_scale: 1.0
    icvf_reward_shift: -1.0

train:
  rep_loss_scale: 0.1
  icvf_hidden_dim: 256
  icvf_num_layers: 2
  icvf_gamma: 0.99
  icvf_expectile: 0.9
  icvf_target_tau: 0.005


wandb:
  use_wandb: true
  policy_arch: mlp
  project: bc-icvf-mlp
  name: ${data.env_name}_${algo.algo_name}_mlp_task${data.dual_task.focused_task_id}_${now:%m%d}_${now:%H%M}_seed${train.seed}_ratio${data.train_ratio}
  group: ${data.env_name}_${algo.algo_name}_mlp
