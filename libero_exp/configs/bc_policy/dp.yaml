defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_policy   
  - ../base/policy@policy: dp    # policy_name: BCTransformerPolicy, image encoder: resnet, fuse: transformer
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir


