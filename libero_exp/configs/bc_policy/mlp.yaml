defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_policy   
  - ../base/policy@policy: mlp_policy    # policy_name: BCMLPPolicy, image encoder: resnet, fuse: mlp
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir


experiment_dir: ???

wandb:
  use_wandb: true
  policy_arch: mlp
  project: bc-ib-mlp
  name: ${data.env_name}_${algo.algo_name}_mlp_${now:%m%d}_${now:%H%M}_seed${train.seed}_ratio${data.train_ratio}_${hydra:job.num}
  group: ${data.env_name}_${algo.algo_name}_mlp

