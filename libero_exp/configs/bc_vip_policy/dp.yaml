defaults:
  - _self_
  - ../base/data@data: default
  - ../base/algo@algo: bc_vip_policy
  - ../base/policy@policy: dp
  - ../base/train@train: default
  - ../base/eval@eval: default
  - ../base/env@env: default
  - ../base/output@_global_: run_dir

experiment_dir: ???

data:
  dual_task:
    enable: true
    focused_task_id: 0
    future_step_min: 1
    future_step_max: 10
    mixed_mode: vip

train:
  rep_loss_scale: 1.0
  vip_embed_dim: 1024
  vip_hidden_dim: 256
  vip_gamma: 0.98
  vip_l2weight: 0.0                # VIP embedding L2 reg (0 disables; original pretraining uses 1.0)
  vip_l1weight: 0.0                # VIP embedding L1 reg (0 disables; original pretraining uses 1.0)
  vip_num_negatives: 0


wandb:
  use_wandb: true
  policy_arch: dp
  project: bc-vip-dp
  name: ${data.env_name}_${algo.algo_name}_dp_task${data.dual_task.focused_task_id}_${now:%m%d}_${now:%H%M}_seed${train.seed}_ratio${data.train_ratio}
  group: ${data.env_name}_${algo.algo_name}_dp
